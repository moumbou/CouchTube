<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="CouchTube">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="128" y2="128">
      <stop offset="0" stop-color="#ff4d4d"/>
      <stop offset="1" stop-color="#ff7a3d"/>
    </linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="128">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <rect width="128" height="128" rx="30" fill="url(#shine)"/>
  <!-- sofa: backrest, seat, armrests, legs -->
  <g fill="#fff">
    <rect x="30" y="30" width="68" height="44" rx="13"/>
    <rect x="14" y="60" width="18" height="36" rx="9"/>
    <rect x="96" y="60" width="18" height="36" rx="9"/>
    <rect x="22" y="72" width="84" height="24" rx="9"/>
    <rect x="28" y="96" width="12" height="9" rx="3"/>
    <rect x="88" y="96" width="12" height="9" rx="3"/>
  </g>
  <!-- seat seam -->
  <rect x="30" y="70" width="68" height="4" fill="url(#bg)"/>
  <!-- play triangle knocked out of the backrest -->
  <path d="M57 41.5 L57 62.5 L77 52 Z" fill="url(#bg)"/>
</svg>
