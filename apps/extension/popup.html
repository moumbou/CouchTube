<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CouchTube</title>
<style>
  :root { --bg: #0f0f0f; --panel: #1c1c1e; --panel-2: #262628; --text: #f2f2f2; --muted: #9a9a9a; --accent: #ff3d3d; --ok: #34c759; --warn: #ffb020; }
  * { box-sizing: border-box; }
  body { margin: 0; width: 300px; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
  .brand .dot { width: 20px; height: 20px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; }
  .brand .dot::after { content: ""; border-left: 8px solid #fff; border-top: 5px solid transparent; border-bottom: 5px solid transparent; margin-left: 2px; }
  .pill { font-size: 11px; padding: 4px 9px; border-radius: 999px; background: var(--panel-2); color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .pill.ok::before { background: var(--ok); } .pill.warn::before { background: var(--warn); } .pill.bad::before { background: var(--accent); }

  .qr { background: #fff; border-radius: 14px; padding: 12px; display: grid; place-items: center; min-height: 200px; }
  .qr svg { width: 100%; height: auto; display: block; }
  .qr .msg { color: #444; text-align: center; font-size: 13px; padding: 20px 8px; }
  .hint { text-align: center; color: var(--muted); }
  .hint b { color: var(--text); }
  .url { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; color: var(--muted); word-break: break-all; background: var(--panel); border-radius: 8px; padding: 8px; user-select: all; }
  .now { background: var(--panel); border-radius: 10px; padding: 8px 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now b { color: var(--text); font-weight: 500; }

  .row { display: flex; gap: 8px; }
  button { flex: 1; height: 36px; border: 0; border-radius: 10px; background: var(--panel-2); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { background: #333; }
  button.primary { background: #fff; color: #000; }
  button.primary:hover { background: #e8e8e8; }

  details { background: var(--panel); border-radius: 10px; padding: 8px 10px; }
  summary { cursor: pointer; color: var(--muted); font-weight: 600; }
  label { display: block; color: var(--muted); margin: 10px 0 4px; font-size: 12px; }
  input { width: 100%; height: 34px; border: 1px solid #333; border-radius: 8px; background: var(--bg); color: var(--text); padding: 0 10px; font: inherit; }
  .error { color: #ffb4b4; font-size: 12px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="dot"></span>CouchTube</div>
    <div class="pill" id="status">Connecting…</div>
  </header>

  <div class="qr" id="qr"><div class="msg">Connecting to relay…</div></div>
  <div class="hint">Scan with your phone camera · <b id="remotes">0</b> connected</div>
  <div class="url" id="url"></div>
  <div class="now" id="now"></div>
  <div class="error hidden" id="error"></div>

  <div class="row">
    <button id="newRoom">New code</button>
    <button id="toggle" class="primary">Pause</button>
  </div>

  <details>
    <summary>Relay server</summary>
    <label for="relay">WebSocket URL (local: ws://localhost:8787, deployed: wss://your-domain)</label>
    <input id="relay" placeholder="ws://localhost:8787">
    <div class="row" style="margin-top:8px"><button id="saveRelay">Save & reconnect</button></div>
  </details>
</div>
<script src="vendor/qrcode.js"></script>
<script src="popup.js"></script>
</body>
</html>
